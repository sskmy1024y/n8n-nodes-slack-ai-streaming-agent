name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --forceExit

      - run: npm run build

      - run: npm config set registry https://registry.npmjs.org/

      # Pre-releases publish under the `beta` dist-tag so they don't become the
      # default `latest` that `npm install` / n8n community-node install pulls.
      - run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}

  publish-github:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@sskmy1024y'

      - run: npm ci

      - run: npm run build

      # GitHub Packages requires scoped package name
      - run: |
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@sskmy1024y/n8n-nodes-slack-ai-streaming-agent';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - run: npm publish --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
